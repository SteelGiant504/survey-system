<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アンケート管理画面</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h1>新しいアンケートの作成</h1>
        <form id="admin-form">
            <div class="form-group">
                <label for="question">質問内容：</label>
                <input type="text" id="question" required placeholder="例：一番好きなデザインはどれですか？">
            </div>
            <div class="form-group">
                <label for="images">選択肢の画像（複数選択可）：</label>
                <input type="file" id="images" accept="image/*" multiple required>
            </div>
            <button type="submit" id="submit-btn">作成してアップロード</button>
        </form>
        <div id="status"></div>
        <div class="admin-link">
            <a href="index.html">回答画面へ戻る</a>
        </div>
    </div>
    <script src="js/supabase-config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>

<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アンケート管理システム</title><link rel="stylesheet" href="css/style.css"></head><body><div class="sidebar"><h2>Survey CMS</h2><a onclick="show('dash')">ダッシュボード</a><a onclick="show('list')">アンケート一覧</a><a onclick="show('edit')">アンケート編集</a><a onclick="show('resp')">回答管理</a><a onclick="show('ana')">集計分析</a><a onclick="show('users')">ユーザー管理</a></div><div class="main"><section id="dash"><h1>ダッシュボード</h1><div class="cards"><div class="card">公開中 12件</div><div class="card">回答数 1,245件</div><div class="card">期限間近 3件</div></div></section><section id="list" class="hidden"><h1>アンケート一覧</h1><div class="card">客室デザイン投票</div><div class="card">忘年会アンケート</div></section><section id="edit" class="hidden"><h1>アンケート編集</h1><input placeholder="アンケート名"><textarea placeholder="説明文"></textarea><button>質問追加</button></section><section id="resp" class="hidden"><h1>回答管理</h1><div class="card">回答一覧表示エリア</div></section><section id="ana" class="hidden"><h1>集計分析</h1><div class="card">グラフ表示エリア</div></section><section id="users" class="hidden"><h1>ユーザー管理</h1><div class="card">管理者 権限設定</div></section></div><script src="js/app.js"></script></body></html>

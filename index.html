<!DOCTYPE html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Survey CMS Ver.3</title><link rel='stylesheet' href='css/style.css'></head><body><div class='sidebar'><h2>Survey CMS</h2><a onclick="show('dashboard')">ダッシュボード</a><a onclick="show('surveys')">アンケート一覧</a><a onclick="show('builder')">アンケート作成</a><a onclick="show('preview')">回答プレビュー</a><a onclick="show('responses')">回答管理</a><a onclick="show('analytics')">集計分析</a><a onclick="show('users')">ユーザー管理</a></div><div class='content'><header><h1>アンケート管理システム</h1></header><section id='dashboard'><div class='cards'><div class='card'><h3>公開中</h3><p>12件</p></div><div class='card'><h3>回答数</h3><p>1,245件</p></div><div class='card'><h3>期限間近</h3><p>3件</p></div></div></section><section id='surveys' class='hide'><h2>アンケート一覧</h2><table><tr><th>名称</th><th>状態</th></tr><tr><td>客室デザイン投票</td><td>公開中</td></tr><tr><td>顧客満足度調査</td><td>下書き</td></tr></table></section><section id='builder' class='hide'><h2>アンケート作成</h2><input placeholder='アンケート名'><input type='datetime-local'><textarea placeholder='説明文'></textarea><select><option>単一選択</option><option>複数選択</option><option>画像選択</option></select><button>質問追加</button><div class='card'>画像選択肢A</div></section><section id='preview' class='hide'><h2>回答プレビュー</h2><div class='card'><label><input type='radio'>A案</label><br><label><input type='radio'>B案</label></div></section><section id='responses' class='hide'><h2>回答管理</h2><div class='card'>回答一覧</div></section><section id='analytics' class='hide'><h2>集計分析</h2><div class='cards'><div class='card'>棒グラフ領域</div><div class='card'>円グラフ領域</div></div></section><section id='users' class='hide'><h2>ユーザー管理</h2><div class='card'>管理者権限</div></section></div><script src='js/app.js'></script></body></html>

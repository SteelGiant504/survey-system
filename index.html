<!DOCTYPE html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Survey CMS Ver2</title><link rel='stylesheet' href='css/style.css'></head><body><aside><h2>Survey CMS</h2><nav><a onclick="showPage('dash')">ダッシュボード</a><a onclick="showPage('surveys')">アンケート一覧</a><a onclick="showPage('builder')">質問設定</a><a onclick="showPage('preview')">回答プレビュー</a><a onclick="showPage('responses')">回答管理</a><a onclick="showPage('analytics')">集計分析</a><a onclick="showPage('users')">ユーザー管理</a></nav></aside><main><section id='dash'><h1>ダッシュボード</h1><div class='grid'><div class='card'>公開中 12件</div><div class='card'>回答数 1,245件</div><div class='card'>期限間近 3件</div></div></section><section id='surveys' class='hidden'><h1>アンケート一覧</h1><button>+新規作成</button><div class='card'>顧客満足度調査</div><div class='card'>客室デザイン投票</div></section><section id='builder' class='hidden'><h1>質問設定</h1><input placeholder='アンケート名'><input type='datetime-local'><select><option>単一選択</option><option>複数選択</option><option>自由記述</option><option>画像選択</option><option>ランキング</option></select><textarea placeholder='質問内容'></textarea><div class='card'>画像選択肢A [画像アップロード]</div><div class='card'>画像選択肢B [画像アップロード]</div></section><section id='preview' class='hidden'><h1>回答プレビュー</h1><div class='card'><h3>好きなデザインを選択してください</h3><label><input type='radio'> A案</label><br><label><input type='radio'> B案</label></div></section><section id='responses' class='hidden'><h1>回答管理</h1><div class='card'>回答一覧テーブル</div></section><section id='analytics' class='hidden'><h1>集計分析</h1><div class='card'>棒グラフエリア</div><div class='card'>円グラフエリア</div></section><section id='users' class='hidden'><h1>ユーザー管理</h1><div class='card'>管理者 / 閲覧専用 権限設定</div></section></main><script src='js/app.js'></script></body></html>
